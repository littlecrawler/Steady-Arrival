<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#214d3e">
  <meta name="description" content="稳步到站：你的本地每日体重、饮食、训练与恢复记录。">
  <title>稳步到站 · 我的健康记录</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <aside class="sidebar">
    <a class="brand" href="#overview" aria-label="稳步到站首页">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#214d3e"/><path d="M10 27V21M20 27V15M30 27V9" stroke="#e0ebc8" stroke-width="4" stroke-linecap="round"/><path d="m9 13 9-5" stroke="#e0ebc8" stroke-width="2" stroke-linecap="round"/></svg>
      <span>稳步到站<small>STEADY ARRIVAL</small></span>
    </a>
    <div class="nav-caption">我的空间</div>
    <nav id="navigation" aria-label="主要导航">
      <a href="#overview" data-view="overview"><span class="nav-icon" data-icon="grid"></span>今日总览</a>
      <a href="#record" data-view="record"><span class="nav-icon" data-icon="edit"></span>每日记录</a>
      <a href="#history" data-view="history"><span class="nav-icon" data-icon="chart"></span>历史与趋势</a>
      <a href="#plan" data-view="plan"><span class="nav-icon" data-icon="calendar"></span>计划与目标</a>
    </nav>
    <div class="sidebar-bottom">
      <div class="mini-quote"><span>每一条记录，</span><br>都让下一步更清楚。</div>
      <div class="local-label"><i></i> 数据保存在本机</div>
      <small>新加坡 / 香港 · UTC+8</small>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="breadcrumb"><span>我的健康记录</span><span class="divider">/</span><strong id="view-label">今日总览</strong></div>
      <div class="topbar-right"><span id="save-status" role="status">正在读取记录…</span><button class="icon-button" data-action="refresh" aria-label="刷新记录" title="刷新记录"><span data-icon="refresh"></span></button><div class="avatar" aria-label="个人空间">稳</div></div>
    </header>
    <main id="main" tabindex="-1"><div class="loading"><div class="spinner"></div><p>正在打开你的记录…</p></div></main>
    <footer class="page-footer"><span>稳步到站 · 从记录到调整</span><span>记录是信息，不是成绩。</span></footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="confirm-dialog" aria-labelledby="dialog-title">
    <form method="dialog"><div class="dialog-header"><h2 id="dialog-title"></h2><button value="cancel" class="icon-button" aria-label="关闭">×</button></div><div id="dialog-content"></div><div id="dialog-actions" class="dialog-actions"></div></form>
  </dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
</body>
</html>
